name: Release Zen icon packs

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-zen-packs
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r scripts/requirements.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Check for pack artwork
        id: icons
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import runpy

          builder = runpy.run_path("scripts/build-zen-packs.py")
          present = any(builder["pack_sources"](Path.cwd(), Path("dist").resolve()))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"present={str(present).lower()}\n")
          if not present:
              print("No icon artwork yet. Tests passed; add icons to enable releases.")
          PY

      - name: Select next release version
        if: steps.icons.outputs.present == 'true'
        env:
          PREVIOUS_SHA: ${{ github.event.before }}
        run: |
          version="$(python3 scripts/next-release-version.py)"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"

      - name: Build and validate packs
        if: steps.icons.outputs.present == 'true'
        run: python3 scripts/build-zen-packs.py --version "$RELEASE_VERSION"

      - name: Check release version
        if: steps.icons.outputs.present == 'true'
        run: |
          for pack in dist/zen-*.zip; do
            unzip -p "$pack" '*/pack.json' |
              jq --exit-status --arg version "$RELEASE_VERSION" '.version == $version'
          done

      - name: Publish release ZIPs
        if: steps.icons.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" dist/zen-*.zip \
            --target "$GITHUB_SHA" --generate-notes \
            --title "Icon Packs for ZenOS $RELEASE_TAG"
